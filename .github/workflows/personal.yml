name: Personal APK build

on:
  push:
    branches: [personal-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build personal NanoGram APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      BANANAGRAM_CCACHE: /usr/bin/ccache
      CCACHE_DIR: /home/runner/.cache/bananagram-personal-ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 2G
      KEY_DIR: /home/runner/.bananagram-personal

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore personal signing key
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /home/runner/.bananagram-personal
          key: bananagram-personal-signing-v1

      - name: Create personal signing key (first run only)
        run: |
          mkdir -p "$KEY_DIR"
          if [ ! -f "$KEY_DIR/release.p12" ] || [ ! -s "$KEY_DIR/pass.txt" ]; then
            PASS="$(openssl rand -hex 12)"
            printf '%s' "$PASS" > "$KEY_DIR/pass.txt"
            rm -f "$KEY_DIR/release.p12"
            keytool -genkeypair -storetype PKCS12 -keystore "$KEY_DIR/release.p12" \
              -storepass "$PASS" -keypass "$PASS" -alias personal \
              -dname "CN=Personal NanoGram" -validity 10000 -keyalg RSA -keysize 4096
          fi
          test -s "$KEY_DIR/release.p12"

      - name: Restore Gradle build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: personal-gradle-tasks-${{ github.run_id }}
          restore-keys: personal-gradle-tasks-

      - name: Restore native compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /home/runner/.cache/bananagram-personal-ccache
          key: personal-ccache-${{ github.run_id }}
          restore-keys: personal-ccache-

      - name: Apply security patches (updates off, AyuSync endpoint dead)
        run: |
          F="TMessagesProj/src/main/java/com/exteragram/messenger/ExteraConfig.java"
          sed -i 's/getBoolean("checkUpdatesOnLaunch", true)/getBoolean("checkUpdatesOnLaunch", false)/' "$F"
          grep -q 'getBoolean("checkUpdatesOnLaunch", false)' "$F"
          F="TMessagesProj/src/main/java/com/radolyn/ayugram/AyuConstants.java"
          sed -i 's/"ayusync-dev.radolyn.com:5000"/"127.0.0.1:1"/; s/"ayusync.cloud"/"127.0.0.1:1"/' "$F"
          if grep -q 'ayusync.cloud' "$F"; then echo 'AyuSync endpoint not patched' >&2; exit 1; fi
                    sed -i 's/APP_DISPLAY_NAME = "BananaGram"/APP_DISPLAY_NAME = "NanoGram"/' "$F"
          grep -q 'APP_DISPLAY_NAME = "NanoGram"' "$F"
          

      - name: Prepare ccache
        run: |
          if ! command -v ccache >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ccache
          fi
          mkdir -p "$CCACHE_DIR"
          ccache --zero-stats

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ''

      - name: Install Android build tools
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Build signed release APK
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          test -n "$TELEGRAM_API_ID" && test -n "$TELEGRAM_API_HASH"
          export BANANAGRAM_RELEASE_KEYSTORE="$KEY_DIR/release.p12"
          export BANANAGRAM_RELEASE_STORE_PASSWORD="$(cat "$KEY_DIR/pass.txt")"
          export BANANAGRAM_RELEASE_KEY_ALIAS=personal
          export BANANAGRAM_RELEASE_KEY_PASSWORD="$BANANAGRAM_RELEASE_STORE_PASSWORD"
          python3 scripts/build-android.py -- --build-cache -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2 :TMessagesProj_AppStandalone:assembleAfatStandalone

      - name: Collect APK
        run: |
          mkdir -p dist
          APK="$(find TMessagesProj_AppStandalone/build -path '*outputs/apk*' -name 'app.apk' | head -n1)"
          if [ -z "$APK" ]; then APK="$(find TMessagesProj_AppStandalone/build -name '*.apk' | head -n1)"; fi
          test -s "$APK"
          cp "$APK" dist/NanoGram-personal.apk
          cd dist && sha256sum ./* > SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NanoGram-personal-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
